# JMeter system properties for App Gateway load test.
# File MUST be named exactly 'system.properties' — JMeter auto-reads this from
# its working directory before any SSL context is initialised.
#
# Setting trustStore=NONE tells JMeter's JsseSSLManager to bypass certificate
# validation (trust-all).  This is required because the App Gateway uses a
# self-signed cert (CN=agw-contoso-ai-primary.eastus.cloudapp.azure.com) that is
# not signed by a globally-trusted CA.
#
# This is safe for load-testing purposes.  Production SDK clients should validate
# the certificate (or import a CA-signed cert via Key Vault).
javax.net.ssl.trustStore=NONE
https.use.cached.ssl.context=false
